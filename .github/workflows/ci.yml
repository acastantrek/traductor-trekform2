name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, tests y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Sin scripts de instalación: la CLI de Supabase y los navegadores se instalan aparte.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Imagen Docker de la API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t classtranslate-api .

  e2e:
    name: Integración BD y E2E
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Supabase local (solo DB, Auth, REST y gateway)
        run: supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Variables de entorno locales
        run: |
          eval "$(supabase status -o env)"
          printf 'SUPABASE_URL=%s\nSUPABASE_SECRET_KEY=%s\n' "$API_URL" "$SECRET_KEY" > apps/api/.env
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_PUBLISHABLE_KEY=%s\n' "$API_URL" "$PUBLISHABLE_KEY" > apps/web/.env
      - run: npm run test:db -w @ct/api
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/report
            e2e/results
          retention-days: 7
